<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Art Portfolio</title>
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<header>
  <h1 id="site-title">Art Portfolio</h1>
  <p id="site-bio" hidden></p>
</header>
<main id="gallery"><p class="status">Loading…</p></main>
<div id="lightbox" class="lightbox" role="dialog" aria-modal="true" aria-label="Artwork viewer" hidden>
  <button type="button" class="lb-close" aria-label="Close">×</button>
  <button type="button" class="lb-prev" aria-label="Previous artwork">‹</button>
  <figure class="lb-figure">
    <img id="lb-image" alt="">
    <figcaption>
      <h2 id="lb-title"></h2>
      <p id="lb-date"></p>
      <p id="lb-desc"></p>
    </figcaption>
  </figure>
  <button type="button" class="lb-next" aria-label="Next artwork">›</button>
</div>
<script src="assets/gallery.js"></script>
</body>
</html>
